<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 歐洲旅遊行程表</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-slate-900">
    <div class="max-w-md mx-auto min-h-screen bg-white flex flex-col shadow-2xl pb-20">
        <header class="bg-indigo-900 text-white p-6 shadow-md sticky top-0 z-10">
            <h1 class="text-2xl font-bold tracking-tight">2026 歐洲三國之旅</h1>
            <div class="flex justify-between items-center mt-2">
                <p class="text-indigo-200 text-sm">2月13日 - 3月1日 | 英國·冰島·荷蘭</p>
                <a href="https://docs.google.com/spreadsheets/d/1CQNaiMdyaZFHmef8SmDc2NfXU3Q9NUpN6j_4lWkpbnI/edit" target="_blank" class="bg-white/10 px-3 py-1 rounded-full text-xs border border-white/20">
                    <i class="fas fa-table mr-1"></i> 原始表單
                </a>
            </div>
        </header>

        <main id="app-content" class="flex-1 p-4 space-y-4">
            </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-3 shadow-lg z-20">
            <button onclick="renderDaily()" id="nav-daily" class="flex flex-col items-center text-indigo-600">
                <i class="fas fa-map-marked-alt text-xl"></i><span class="text-[10px] mt-1 font-bold">每日行程</span>
            </button>
            <button onclick="renderHotels()" id="nav-hotels" class="flex flex-col items-center text-gray-400">
                <i class="fas fa-bed text-xl"></i><span class="text-[10px] mt-1 font-bold">住宿清單</span>
            </button>
            <button onclick="renderNotes()" id="nav-notes" class="flex flex-col items-center text-gray-400">
                <i class="fas fa-info-circle text-xl"></i><span class="text-[10px] mt-1 font-bold">旅遊備註</span>
            </button>
        </nav>
    </div>

    <script>
        // 根據您更新的試算表內容與 Column 7 連結整理 
        const scheduleData = [
            { date: "2/13 (五)", title: "倫敦 - 抵達", desc: "TWN-LHR 8:40-16:55 (T3)", link: "https://www.google.com/maps/search/Heathrow+Airport+Terminal+3", type: "flight" },
            { date: "2/15 (日)", title: "冰島 - 出發", desc: "LHR-KEF 13:40-17:05 (T5)", link: "https://www.google.com/maps/search/Keflavík+International+Airport", type: "flight" },
            { date: "2/16-17", title: "冰島 - 南岸探索", desc: "參加 3 天 2 夜當地套裝行程", link: "https://www.google.com/maps/search/Iceland+South+Coast", type: "tour" },
            { date: "2/18 (三)", title: "冰島 - 返回市區", desc: "回到雷克雅維克市區", link: "https://www.google.com/maps/search/Reykjavík+City+Center", type: "info" },
            { date: "2/21 (六)", title: "返回倫敦", desc: "KEF-LHR 11:55-15:05 (T5)", link: "https://www.google.com/maps/search/London+Kings+Cross+Station", type: "flight" },
            { date: "2/22 (日)", title: "倫敦 - 文化日", desc: "大英博物館、音樂劇《歌劇魅影》", link: "https://www.britishmuseum.org/", type: "info" },
            { date: "2/27 (五)", title: "阿姆斯特丹 - 跨國", desc: "Eurostar 火車 11:04-16:11", link: "https://www.eurostar.com/", type: "train" },
            { date: "3/1 (日)", title: "返台", desc: "AMS-TW 20:05-15:45 (T2)", link: "https://www.google.com/maps/search/Schiphol+Airport", type: "flight" }
        ];

        const hotelData = [
            { name: "Point A Hotel Paddington", city: "倫敦", link: "https://www.google.com/maps/search/Point+A+Hotel+London+Paddington" },
            { name: "Hotel Von / Centrum", city: "冰島", link: "https://www.google.com/maps/search/Hotel+Von+Reykjavik" },
            { name: "Hotel Estheréa", city: "阿姆斯特丹", link: "https://www.google.com/maps/search/Hotel+Estherea+Amsterdam" }
        ];

        function renderDaily() {
            updateNav(0);
            const content = document.getElementById('app-content');
            content.innerHTML = scheduleData.map(item => `
                <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-xs font-black text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded">${item.date}</span>
                            <h3 class="text-lg font-bold text-slate-800 mt-1">${item.title}</h3>
                        </div>
                        ${item.link ? `<a href="${item.link}" target="_blank" class="bg-blue-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform"><i class="fas fa-external-link-alt text-sm"></i></a>` : ''}
                    </div>
                    <p class="text-sm text-slate-500 leading-relaxed">${item.desc}</p>
                </div>
            `).join('');
        }

        function renderHotels() {
            updateNav(1);
            const content = document.getElementById('app-content');
            content.innerHTML = hotelData.map(hotel => `
                <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-5 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="text-xs font-bold text-indigo-400 uppercase tracking-widest">${hotel.city}</p>
                        <h3 class="text-lg font-black text-indigo-900">${hotel.name}</h3>
                    </div>
                    <a href="${hotel.link}" target="_blank" class="text-indigo-600 bg-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm border border-indigo-100"><i class="fas fa-map-location-dot text-xl"></i></a>
                </div>
            `).join('');
        }

        function renderNotes() {
            updateNav(2);
            document.getElementById('app-content').innerHTML = `
                <div class="space-y-6 animate-fadeIn">
                    <section class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                        <h3 class="font-black text-slate-800 border-l-4 border-indigo-500 pl-3 mb-4 text-xl">🇬🇧 倫敦必看</h3>
                        <ul class="space-y-3 text-slate-600 text-sm">
                            <li class="flex items-center"><i class="fas fa-check-circle text-indigo-400 mr-2"></i> 羅塞塔石碑 (大英博物館)</li>
                            <li class="flex items-center"><i class="fas fa-check-circle text-indigo-400 mr-2"></i> 歌劇魅影 (Her Majesty's Theatre)</li>
                        </ul>
                    </section>
                    <section class="bg-amber-50 p-5 rounded-3xl border border-amber-100 shadow-sm">
                        <h3 class="font-black text-amber-900 mb-4 text-xl">💡 實用備註</h3>
                        <p class="text-sm text-amber-800 leading-relaxed">倫敦自助洗衣：6kg 約 £6 / 10kg 約 £8。<br>冰島當地團務必提早 15 分鐘抵達接送點。</p>
                    </section>
                </div>
            `;
        }

        function updateNav(index) {
            const ids = ['nav-daily', 'nav-hotels', 'nav-notes'];
            ids.forEach((id, i) => {
                const el = document.getElementById(id);
                el.className = i === index ? "flex flex-col items-center text-indigo-600" : "flex flex-col items-center text-gray-400";
            });
        }

        // 初始化
        renderDaily();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
    </style>
</body>
</html>
