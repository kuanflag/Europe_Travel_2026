<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 歐洲旅遊詳情版</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .details-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .expanded .details-content { max-height: 1200px; transition: max-height 0.5s ease-in; }
        .chevron { transition: transform 0.3s; }
        .expanded .chevron { transform: rotate(180deg); }
        .bg-indigo-950 { background-color: #1a1c33; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-slate-900">
    <div class="max-w-md mx-auto min-h-screen bg-white flex flex-col shadow-2xl">
        <header class="bg-indigo-950 text-white p-6 sticky top-0 z-20 shadow-lg">
            <h1 class="text-2xl font-bold tracking-tighter">2026 歐洲之旅</h1>
            <p class="text-indigo-300 text-xs mt-1 font-medium tracking-widest uppercase">Itinerary: UK / Iceland / NL</p>
        </header>

        <main id="schedule-container" class="flex-1 p-4 space-y-3">
            </main>
        
        <footer class="p-8 text-center text-gray-400 text-xs bg-gray-50">
            © 2026 Europe Travel | 點擊卡片查看詳細內容
        </footer>
    </div>

    <script>
        const fullSchedule = [
            { date: "2/13 (五)", city: "倫敦", transport: "TWN-LHR (8:40-16:55)", stay: "Point A Paddington", plan: "抵達機場後入住飯店", note: "辦理 Oyster Card", link: "https://maps.app.goo.gl/Paddington", type: "plane" },
            { date: "2/14 (六)", city: "倫敦", transport: "地鐵/步行", stay: "Point A Paddington", plan: "市區適應時差、拜訪朋友", note: "建議在飯店附近超市買備品", link: "https://www.google.com/maps", type: "walk" },
            { date: "2/15 (日)", city: "冰島", transport: "LHR-KEF (13:40-17:05)", stay: "Hotel Von", plan: "飛往冰島，接駁車至市區", note: "晚上可去超市採買零食", link: "https://maps.app.goo.gl/HotelVon", type: "plane" },
            { date: "2/16 (一)", city: "冰島", transport: "Tour 小巴", stay: "當地民宿 (Tour 含)", plan: "南岸 Day 1: 瀑布巡禮", note: "穿著防水防風衣物", link: "https://www.guidetoiceland.is", type: "bus" },
            { date: "2/17 (二)", city: "冰島", transport: "Tour 小巴", stay: "當地民宿 (Tour 含)", plan: "南岸 Day 2: 冰川健行", note: "體力消耗大，準備高熱量零食", link: "https://www.guidetoiceland.is", type: "bus" },
            { date: "2/18 (三)", city: "冰島", transport: "Tour 小巴", stay: "Hotel Von", plan: "南岸 Day 3: 返回市區", note: "如有極光機會可加購行程", link: "https://maps.app.goo.gl/HotelVon", type: "bus" },
            { date: "2/19 (四)", city: "冰島", transport: "接駁車", stay: "Hotel Von", plan: "藍湖溫泉或市區觀光", note: "藍湖需提早預約", link: "https://www.bluelagoon.com/", type: "swim" },
            { date: "2/20 (五)", city: "冰島", transport: "市區步行", stay: "Hotel Von", plan: "雷克雅維克市區巡禮", note: "可吃 Bæjarins Beztu Pylsur 熱狗", link: "https://www.google.com/maps", type: "walk" },
            { date: "2/21 (六)", city: "倫敦", transport: "KEF-LHR (11:55-15:05)", stay: "Point A Kings Cross", plan: "飛回倫敦，入住 Kings Cross", note: "晚上可在車站周邊晚餐", link: "https://maps.app.goo.gl/KingsCross", type: "plane" },
            { date: "2/22 (日)", city: "倫敦", transport: "地鐵", stay: "Point A Kings Cross", plan: "10:00 大英博物館, 19:30 歌劇魅影", note: "劇院需提早30分進場", link: "https://www.britishmuseum.org/", type: "theater" },
            { date: "2/23 (一)", city: "倫敦", transport: "地鐵", stay: "Point A Kings Cross", plan: "白金漢宮衛兵交接、西敏寺", note: "注意交接日期", link: "https://www.rct.uk/visit/buckinghampalace", type: "walk" },
            { date: "2/24 (二)", city: "倫敦", transport: "地鐵", stay: "Point A Kings Cross", plan: "格林威治、泰晤士河遊船", note: "可使用 Oyster Card 刷遊船", link: "https://www.rmg.co.uk/greenwich", type: "ship" },
            { date: "2/25 (三)", city: "倫敦", transport: "地鐵", stay: "Point A Kings Cross", plan: "劍橋或牛津大學一日遊", note: "火車票建議提早買", link: "https://www.nationalrail.co.uk/", type: "train" },
            { date: "2/26 (四)", city: "倫敦", transport: "地鐵", stay: "Point A Kings Cross", plan: "哈利波特影城或波特貝羅市集", note: "影城非常難訂，務必提早", link: "https://www.wbstudiotour.co.uk/", type: "magic" },
            { date: "2/27 (五)", city: "阿姆", transport: "Eurostar (11:04-16:11)", stay: "Hotel Estheréa", plan: "前往阿姆斯特丹，運河區散步", note: "飯店提供免費點心", link: "https://www.eurostar.com/", type: "train" },
            { date: "2/28 (六)", city: "阿姆", transport: "電車/步行", stay: "Hotel Estheréa", plan: "安妮之家、海尼根博物館", note: "安妮之家需提早數月預訂", link: "https://www.annefrank.org/", type: "beer" },
            { date: "3/1 (日)", city: "返台", transport: "AMS-TW (20:05-15:45)", stay: "機上", plan: "海尼根博物館後前往機場", note: "提早 3 小時抵達機場", link: "https://www.schiphol.nl/", type: "plane" }
        ];

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = fullSchedule.map((item, index) => `
                <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm" id="card-${index}">
                    <div onclick="toggleCard(${index})" class="p-4 flex justify-between items-center cursor-pointer bg-white active:bg-gray-50">
                        <div class="flex items-center space-x-4">
                            <div class="text-center bg-indigo-50 px-2 py-1 rounded-lg border border-indigo-100 min-w-[65px]">
                                <span class="block text-[9px] text-indigo-400 font-bold uppercase">${item.city}</span>
                                <span class="block text-xs font-black text-indigo-700">${item.date}</span>
                            </div>
                            <h3 class="font-bold text-gray-700 text-sm truncate w-48">${item.plan}</h3>
                        </div>
                        <i class="fas fa-chevron-down text-gray-300 text-xs chevron"></i>
                    </div>

                    <div class="details-content bg-gray-50/50">
                        <div class="p-5 pt-0 space-y-4 text-sm border-t border-gray-100">
                            <div class="flex items-start space-x-3 mt-4">
                                <i class="fas fa-route text-indigo-500 mt-1 w-4 text-center"></i>
                                <div><p class="font-bold text-gray-800 text-xs">1. 交通 (Column 3)</p><p class="text-gray-500">${item.transport}</p></div>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fas fa-bed text-indigo-500 mt-1 w-4 text-center"></i>
                                <div><p class="font-bold text-gray-800 text-xs">2. 住宿 (Column 4)</p><p class="text-gray-500">${item.stay}</p></div>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fas fa-map-pin text-indigo-500 mt-1 w-4 text-center"></i>
                                <div><p class="font-bold text-gray-800 text-xs">3. 行程 (Column 5)</p><p class="text-gray-500">${item.plan}</p></div>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fas fa-sticky-note text-amber-500 mt-1 w-4 text-center"></i>
                                <div><p class="font-bold text-gray-800 text-xs">4. 備註 (Column 6)</p><p class="text-gray-500 italic">${item.note}</p></div>
                            </div>
                            <div class="pt-2">
                                <a href="${item.link}" target="_blank" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold flex items-center justify-center space-x-2 shadow-md active:bg-indigo-700 text-xs">
                                    <i class="fas fa-location-arrow"></i>
                                    <span>開啟連結 (Column 7)</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCard(index) {
            const card = document.getElementById(`card-${index}`);
            const isExpanded = card.classList.contains('expanded');
            document.querySelectorAll('.expanded').forEach(c => c.classList.remove('expanded'));
            if (!isExpanded) card.classList.add('expanded');
            // 點擊時自動滾動到該卡片
            if (!isExpanded) {
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }
        }

        renderSchedule();
    </script>
</body>
</html>
