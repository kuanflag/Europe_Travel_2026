<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歐洲旅行 UK->IceLand->Netherland</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page-transition { transition: transform 0.3s ease-in-out; }
        .slide-in { transform: translateX(0); }
        .slide-out { transform: translateX(100%); }
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 overflow-hidden text-slate-900">
    <div id="list-page" class="max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col relative z-10">
        <header class="bg-indigo-950 text-white p-6 pt-12 shadow-lg text-center font-bold">
            <h1 class="text-lg uppercase tracking-wider">歐洲旅行 UK -> IceLand -> Netherland</h1>
        </header>
        <main id="list-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            </main>
    </div>

    <div id="detail-page" class="fixed inset-0 max-w-md mx-auto bg-white z-20 page-transition slide-out shadow-2xl flex flex-col">
        <header class="bg-slate-50 p-4 flex items-center border-b sticky top-0">
            <button onclick="closeDetail()" class="p-2 text-slate-600 active:bg-gray-200 rounded-full">
                <i class="fas fa-arrow-left text-xl"></i>
            </button>
            <h2 id="detail-date" class="ml-4 font-bold text-lg text-slate-800">詳細資訊</h2>
        </header>
        <main class="flex-1 overflow-y-auto p-6 space-y-6">
            <div id="detail-content"></div>
            <div id="links-container" class="pt-4 border-t border-gray-100 space-y-3"></div>
        </main>
    </div>

    <script>
        const travelData = [
            { 
                date: "2/13 (五)", city: "倫敦", 
                transport: "TWN -> LHR 8:40(T1) -> 16:55(T3)", 
                stay: "Point A Hotel London Paddington", 
                plan: "1. 希斯洛機場快線\n2. 車站買 Sainsbury's / Marks＆Spencer 套餐，或樓上 Leon\n3. 賭場 Grosvenor Casino (The Victoria)", 
                note: "Paddington Bear 名稱源自此，穿著厚呢風衣與長統靴是經典形象。", 
                links: [{ label: "1. 倫敦遊記影片", url: "https://www.instagram.com/reel/C9w9ob7tgI7/" }] 
            },
            { 
                date: "2/14 (六)", city: "倫敦", 
                transport: "市區交通", 
                stay: "Point A Hotel London Paddington", 
                plan: "1. 拜訪朋友 Latifa 家 (50 Greenways)\n2. 西敏寺、國會大廈、大笨鐘、倫敦塔橋", 
                note: "西敏寺建議預約，步行過西敏橋可拍大笨鐘全景。", 
                links: [{ label: "1. 倫敦遊記影片", url: "https://www.instagram.com/reel/C9w9ob7tgI7/" }] 
            },
            { 
                date: "2/15 (日)", city: "冰島", 
                transport: "LHR -> KEF 13:40(T5) -> 17:05", 
                stay: "Hotel Von (不含早)", 
                plan: "1. Hallgrimskirkja 教堂\n2. 超市 Bónus 採買未來幾天糧食", 
                note: "尚需訂購門票與交通車，下機注意保暖。", 
                links: [] 
            },
            { 
                date: "2/16 (一)", city: "冰島", 
                transport: "Local Tour", 
                stay: "3 Days Local Tour (含宿)", 
                plan: "冰島 Local Tour 三天兩夜行程第一日：南岸瀑布與黑沙灘之旅。", 
                note: "內容細節參考連結。", 
                links: [{ label: "1. Local Tour 內容詳情", url: "https://cn.guidetoiceland.is/book-holiday-trips/jokulsarlon-lagoon-and-ice-caving-three-day-tour?adults=2&dateFrom=2026-02-16&dateTo=2026-02-18" }] 
            },
            { 
                date: "2/17 (二)", city: "冰島", 
                transport: "Local Tour", 
                stay: "3 Days Local Tour (含宿)", 
                plan: "冰島 Local Tour 三天兩夜行程第二日：冰川健行與冰洞探險。", 
                note: "住宿已含在 Tour 費用內。", 
                links: [{ label: "1. Local Tour 內容詳情", url: "https://cn.guidetoiceland.is/book-holiday-trips/jokulsarlon-lagoon-and-ice-caving-three-day-tour?adults=2&dateFrom=2026-02-16&dateTo=2026-02-18" }] 
            },
            { 
                date: "2/18 (三)", city: "冰島", 
                transport: "Back to 雷克雅維克", 
                stay: "Hotel Reykjavik Centrum (含早)", 
                plan: "1. 超市 Town Market\n2. Blue Lagoon 藍湖溫泉\n3. Viking Village 晚餐", 
                note: "首推 Viking Village，需搭公車或自駕(約38分)。", 
                links: [{ label: "1. Blue Lagoon 預約官網", url: "https://www.bluelagoon.com/" }] 
            },
            { 
                date: "2/19 (四)", city: "冰島", 
                transport: "市區交通", 
                stay: "Hotel Reykjavik Centrum", 
                plan: "1. 雷克雅維克市區巡禮\n2. 餐廳：Old Iceland 或 Three coats", 
                note: "飯店對面有超市可補給。", 
                links: [] 
            },
            { 
                date: "2/20 (五)", city: "冰島", 
                transport: "市區活動", 
                stay: "Hotel Reykjavik Centrum", 
                plan: "1. 訂位餐廳 Fjörukráin\n2. 自由時間補齊景點或極光行程", 
                note: "最後一晚冰島，建議提前訂位餐廳。", 
                links: [{ label: "1. Fjörukráin 餐廳訂位", url: "https://bookings.dineout.is/fjorukrain?do_referrer=OcjATyyurm&lng=zh-TW" }] 
            },
            { 
                date: "2/21 (六)", city: "倫敦", 
                transport: "KEF -> LHR 11:55 -> 15:05(T5)", 
                stay: "Point A Hotel Kings Cross", 
                plan: "飛回倫敦，入住 Kings Cross 附近飯店休息、晚餐。", 
                note: "Kings Cross 附近有 9 3/4 月台可以拍照。", 
                links: [] 
            },
            { 
                date: "2/22 (日)", city: "倫敦", 
                transport: "市區交通", 
                stay: "Point A Hotel Kings Cross", 
                plan: "牛津一日遊：\n1. Radcliffe Camera 圓形圖書館\n2. 嘆息橋\n3. Christ Church (哈利波特餐廳)", 
                note: "車站走至大學約 15 分鐘，學院散落各處。", 
                links: [] 
            },
            { 
                date: "2/23 (一)", city: "倫敦", 
                transport: "市區交通", 
                stay: "Point A Hotel Kings Cross", 
                plan: "1. 白金漢宮衛兵交接(11:00)\n2. 皇家馬廄\n3. SOHO / Piccadilly Circus / 波羅市場\n4. Genting Casino Chinatown", 
                note: "衛兵交接建議 10 點前卡位，波羅市場必吃手撕豬肉三明治。", 
                links: [{ label: "1. 皇家馬廄資訊", url: "https://flybyfantasy.com/london-tourist-spot/the-royal-mews/" }] 
            },
            { 
                date: "2/27 (五)", city: "阿姆", 
                transport: "Eurostar 11:04 -> 16:20", 
                stay: "Hotel Estheréa", 
                plan: "1. 紅燈區秘密博物館\n2. Casa Rosso 成人秀 (65歐)", 
                note: "歐洲之星從 St Pancras 車站出發。", 
                links: [{ label: "1. Casa Rosso 官網", url: "https://www.casarosso.nl/" }] 
            },
            { 
                date: "2/28 (六)", city: "阿姆", 
                transport: "市區交通", 
                stay: "Hotel Estheréa", 
                plan: "1. 水壩廣場、運河遊船、安妮之家\n2. 海尼根博物館、梵谷博物館", 
                note: "安妮之家需提前數月預訂，飯店位於運河中心。", 
                links: [] 
            },
            { 
                date: "3/1 (日)", city: "返台", 
                transport: "AMS -> TW 20:05 -> 15:45", 
                stay: "機上", 
                plan: "1. A'DAM Tower\n2. 大麻博物館", 
                note: "生存成功！回台灣拉！提早 3 小時抵達機場。", 
                links: [] 
            }
        ];

        function init() {
            const listContainer = document.getElementById('list-container');
            listContainer.innerHTML = travelData.map((item, index) => `
                <div onclick="showDetail(${index})" class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm flex items-center justify-between active:bg-gray-50 transition-all">
                    <div class="flex items-center space-x-4">
                        <div class="text-center bg-indigo-50 w-16 py-2 rounded-xl">
                            <span class="block text-[10px] text-indigo-400 font-bold uppercase">${item.city}</span>
                            <span class="block text-sm font-black text-indigo-700">${item.date.split(' ')[0]}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm truncate w-40 text-left">${item.plan.split('\n')[0]}</h3>
                    </div>
                    <i class="fas fa-chevron-right text-slate-200"></i>
                </div>
            `).join('');
        }

        function showDetail(index) {
            const item = travelData[index];
            document.getElementById('detail-date').innerText = item.date;
            document.getElementById('detail-content').innerHTML = `
                <div class="space-y-6 text-left">
                    <section><label class="text-[10px] font-black text-indigo-300 uppercase block mb-1 tracking-widest text-left">航班 / 火車</label>
                        <div class="text-sm text-slate-700 font-semibold bg-indigo-50/50 p-3 rounded-xl"><i class="fas fa-route mr-2 text-indigo-500"></i>${item.transport}</div></section>
                    <section><label class="text-[10px] font-black text-indigo-300 uppercase block mb-1 tracking-widest text-left">住宿資訊</label>
                        <div class="text-sm text-slate-700 font-semibold bg-emerald-50/50 p-3 rounded-xl"><i class="fas fa-hotel mr-2 text-emerald-500"></i>${item.stay}</div></section>
                    <section><label class="text-[10px] font-black text-indigo-300 uppercase block mb-1 tracking-widest text-left">每日行程內容</label>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm text-slate-600 leading-relaxed whitespace-pre-wrap text-left">${item.plan}</div></section>
                    <section><label class="text-[10px] font-black text-indigo-300 uppercase block mb-1 tracking-widest text-left">重要備註</label>
                        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100 text-sm text-amber-800 italic text-left">${item.note}</div></section>
                </div>
            `;
            const linksContainer = document.getElementById('links-container');
            if (item.links && item.links.length > 0) {
                linksContainer.innerHTML = `<label class="text-[10px] font-black text-slate-300 uppercase block mb-3 tracking-widest text-center">參考連結 (點選開啟)</label>` + 
                item.links.map(link => `
                    <a href="${link.url}" target="_blank" class="flex items-center justify-between bg-indigo-900 text-white px-5 py-4 rounded-2xl font-bold shadow-md active:bg-indigo-800 mb-2">
                        <span class="text-sm text-left">${link.label}</span>
                        <i class="fas fa-external-link-alt text-xs text-indigo-300"></i>
                    </a>
                `).join('');
            } else { linksContainer.innerHTML = ''; }
            const detailPage = document.getElementById('detail-page');
            detailPage.classList.remove('slide-out');
            detailPage.classList.add('slide-in');
        }

        function closeDetail() {
            const detailPage = document.getElementById('detail-page');
            detailPage.classList.remove('slide-in');
            detailPage.classList.add('slide-out');
        }
        init();
    </script>
</body>
</html>
